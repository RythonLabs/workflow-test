name: PR review

on:
  pull_request_review:
    types: [submitted]

jobs:
  re_request_team_review:
    if: github.event.review.state == 'approved' || github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Log review event details
        run: |
          echo "================================================"
          echo "Review Event Triggered"
          echo "================================================"
          echo "Reviewer: ${{ github.event.review.user.login }}"
          echo "Review State: ${{ github.event.review.state }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "Repository: ${{ github.repository }}"
          echo "Organization: ${{ github.repository_owner }}"
          echo "Review ID: ${{ github.event.review.id }}"
          echo "Review Submitted At: ${{ github.event.review.submitted_at }}"
          echo "================================================"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get teams from CODEOWNERS
        id: get_teams
        run: |
          ORG="${{ github.repository_owner }}"

          CODEOWNERS_FILE=""
          for f in CODEOWNERS .github/CODEOWNERS docs/CODEOWNERS; do
            [ -f "$f" ] && CODEOWNERS_FILE="$f" && break
          done

          if [ -z "$CODEOWNERS_FILE" ]; then
            echo "No CODEOWNERS file found — nothing to re-request."
            echo "teams=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Reading teams from: $CODEOWNERS_FILE"

          TEAMS=$(grep -oE "@[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+" "$CODEOWNERS_FILE" \
            | sed "s|@$ORG/||I" \
            | sort -u)

          echo "Teams found:"
          if [ -z "$TEAMS" ]; then
            echo "  (none)"
          else
            echo "$TEAMS" | while read -r team; do echo "  - $team"; done
          fi

          echo "teams<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TEAMS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Re-request team reviews
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          TEAMS="${{ steps.get_teams.outputs.teams }}"

          if [ -z "$TEAMS" ]; then
            echo "No CODEOWNERS teams found — nothing to re-request."
            exit 0
          fi

          # Wait for GitHub to finish processing the review event before re-requesting.
          # Without this, GitHub removes the team again immediately after we add it.
          sleep 5

          TEAMS_RE_REQUESTED=0

          for team_slug in $TEAMS; do
            echo "Re-requesting review from team: $team_slug"

            RESPONSE=$(gh api \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/${{ github.repository }}/pulls/$PR_NUMBER/requested_reviewers \
              -f "team_reviewers[]=$team_slug" 2>&1) || true
            STATUS=$?

            if [ $STATUS -eq 0 ]; then
              echo "  ✓ Successfully re-requested: $team_slug"
              TEAMS_RE_REQUESTED=$((TEAMS_RE_REQUESTED + 1))
            else
              echo "  ✗ Failed to re-request: $team_slug"
              echo "  Error: $RESPONSE"
            fi
          done

          echo "Teams re-requested: $TEAMS_RE_REQUESTED"

      - name: Verify final PR reviewer state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FINAL_RESPONSE=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers)

          echo "Requested Teams:"
          echo "$FINAL_RESPONSE" | jq -r '.teams[].slug // "(none)"'

          echo "Requested Individual Reviewers:"
          echo "$FINAL_RESPONSE" | jq -r '.users[].login // "(none)"'
