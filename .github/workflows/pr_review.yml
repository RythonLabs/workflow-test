name: PR review

on:
  pull_request_review:
    types: [submitted]

jobs:
  re_request_team_review:
    if: github.event.review.state == 'approved' || github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Get teams from CODEOWNERS
        id: get_teams
        run: |
          ORG="${{ github.repository_owner }}"

          CODEOWNERS_FILE=""
          for f in CODEOWNERS .github/CODEOWNERS docs/CODEOWNERS; do
            [ -f "$f" ] && CODEOWNERS_FILE="$f" && break
          done

          if [ -z "$CODEOWNERS_FILE" ]; then
            echo "No CODEOWNERS file found — nothing to re-request."
            echo "teams=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Reading teams from: $CODEOWNERS_FILE"

          TEAMS=$(grep -oE "@[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+" "$CODEOWNERS_FILE" \
            | sed "s|@$ORG/||I" \
            | sort -u)

          echo "Teams found: $(echo "$TEAMS" | tr '\n' ' ')"

          echo "teams<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TEAMS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Re-request team reviews
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          TEAMS="${{ steps.get_teams.outputs.teams }}"

          if [ -z "$TEAMS" ]; then
            echo "No CODEOWNERS teams found — nothing to re-request."
            exit 0
          fi

          TEAMS_RE_REQUESTED=0
          MAX_ATTEMPTS=6
          RETRY_DELAY=5  # seconds between attempts; 6 * 5 = 30s max wait per team

          while IFS= read -r team_slug; do
            [ -z "$team_slug" ] && continue
            echo "Re-requesting review from team: $team_slug"

            CONFIRMED=false
            for attempt in $(seq 1 $MAX_ATTEMPTS); do
              echo "  Attempt $attempt/$MAX_ATTEMPTS..."

              gh api \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                /repos/${{ github.repository }}/pulls/$PR_NUMBER/requested_reviewers \
                -f "team_reviewers[]=$team_slug" > /dev/null

              # Confirm the team is actually present — GitHub may remove it immediately
              # if review event processing hasn't settled yet.
              CURRENT_TEAMS=$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                /repos/${{ github.repository }}/pulls/$PR_NUMBER/requested_reviewers \
                --jq '[.teams[].slug] | join(",")')

              if echo "$CURRENT_TEAMS" | grep -qF "$team_slug"; then
                echo "  ✓ Confirmed: $team_slug is in requested reviewers"
                TEAMS_RE_REQUESTED=$((TEAMS_RE_REQUESTED + 1))
                CONFIRMED=true
                break
              fi

              echo "  Team not yet present (current: ${CURRENT_TEAMS:-none}), retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            done

            if [ "$CONFIRMED" = false ]; then
              echo "  ✗ Failed to confirm $team_slug after $MAX_ATTEMPTS attempts"
            fi
          done <<< "$TEAMS"

          echo "Teams re-requested: $TEAMS_RE_REQUESTED"
