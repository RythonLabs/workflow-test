name: PR review

on:
  pull_request_review:
    types: [submitted]

jobs:
  re_request_team_review:
    if: github.event.review.state == 'approved' || github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      # How many approvals from a team are required before we stop re-requesting.
      # ponytail: hardcoded for now; move to a config file if teams need different thresholds.
      REQUIRED_APPROVALS: 2
    steps:
      - name: Log review event details
        run: |
          echo "================================================"
          echo "Review Event Triggered"
          echo "================================================"
          echo "Reviewer: ${{ github.event.review.user.login }}"
          echo "Review State: ${{ github.event.review.state }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "Repository: ${{ github.repository }}"
          echo "Organization: ${{ github.repository_owner }}"
          echo "Review ID: ${{ github.event.review.id }}"
          echo "Review Submitted At: ${{ github.event.review.submitted_at }}"
          echo "Required approvals threshold: $REQUIRED_APPROVALS"
          echo "================================================"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get teams from CODEOWNERS
        id: get_teams
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Parse CODEOWNERS for team entries (@org/slug), extract just the slug.
          # Then check if the reviewer is an active member of each team via REST
          # (no read:org scope needed — GITHUB_TOKEN can check membership for its own org).
          REVIEWER="${{ github.event.review.user.login }}"
          ORG="${{ github.repository_owner }}"

          CODEOWNERS_FILE=""
          for f in CODEOWNERS .github/CODEOWNERS docs/CODEOWNERS; do
            [ -f "$f" ] && CODEOWNERS_FILE="$f" && break
          done

          if [ -z "$CODEOWNERS_FILE" ]; then
            echo "No CODEOWNERS file found — nothing to re-request."
            echo "teams=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Reading teams from: $CODEOWNERS_FILE"

          # Extract @org/slug entries, strip the @org/ prefix to get bare slugs
          ALL_CODEOWNER_TEAMS=$(grep -oE '@[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' "$CODEOWNERS_FILE" \
            | sed "s|@$ORG/||I" \
            | sort -u)

          echo "CODEOWNERS teams: $(echo "$ALL_CODEOWNER_TEAMS" | tr '\n' ' ')"
          echo ""

          # Keep only teams the reviewer is an active member of
          TEAMS=""
          for team_slug in $ALL_CODEOWNER_TEAMS; do
            MEMBERSHIP=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /orgs/$ORG/teams/$team_slug/memberships/$REVIEWER 2>/dev/null)
            if echo "$MEMBERSHIP" | jq -e '.state == "active"' > /dev/null 2>&1; then
              echo "  ✓ $REVIEWER is active member of: $team_slug"
              TEAMS="$TEAMS $team_slug"
            else
              echo "  - $REVIEWER is not a member of: $team_slug"
            fi
          done

          TEAMS=$(echo "$TEAMS" | tr ' ' '\n' | sed '/^$/d')

          echo ""
          echo "Teams to re-request:"
          if [ -z "$TEAMS" ]; then
            echo "  (none — reviewer is not in any CODEOWNERS team)"
          else
            echo "$TEAMS" | while read -r team; do echo "  - $team"; done
          fi

          echo "teams<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TEAMS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Check approval count and re-request if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          echo ""
          echo "================================================"
          echo "Checking Team Membership and Approval Counts"
          echo "================================================"

          ORG="${{ github.repository_owner }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REQUESTED_TEAMS="${{ steps.get_teams.outputs.teams }}"

          echo "Organization: $ORG"
          echo "Reviewer: $REVIEWER"
          echo "Required approvals: $REQUIRED_APPROVALS"
          echo ""

          if [ -z "$REQUESTED_TEAMS" ]; then
            echo "Reviewer is not a member of any CODEOWNERS team — nothing to re-request."
            exit 0
          fi

          # Fetch all reviews on this PR once (reused for every team below)
          ALL_REVIEWS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews)

          echo "All reviews fetched. Total review records: $(echo "$ALL_REVIEWS" | jq 'length')"
          echo ""

          TEAMS_RE_REQUESTED=0
          TEAMS_THRESHOLD_MET=0

          for team_slug in $REQUESTED_TEAMS; do
            echo "----------------------------------------"
            echo "Team: $team_slug"

            # Fetch all members of this team to count their approvals on this PR
            TEAM_MEMBERS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /orgs/$ORG/teams/$team_slug/members \
              | jq -r '.[].login')

            echo "  Team members: $(echo "$TEAM_MEMBERS" | tr '\n' ' ')"

            # Count distinct approvals from team members
            # Use only the latest review per user (GitHub keeps history; last state wins)
            APPROVAL_COUNT=$(echo "$ALL_REVIEWS" \
              | jq --argjson members "$(echo "$TEAM_MEMBERS" | jq -R . | jq -s .)" \
              '[
                group_by(.user.login)[]
                | last
                | select(.state == "APPROVED" and (.user.login as $u | $members | index($u) != null))
              ] | length')

            echo "  Approvals from team members so far: $APPROVAL_COUNT / $REQUIRED_APPROVALS"

            if [ "$APPROVAL_COUNT" -ge "$REQUIRED_APPROVALS" ]; then
              echo "  ✓ Approval threshold met — no re-request needed"
              TEAMS_THRESHOLD_MET=$((TEAMS_THRESHOLD_MET + 1))
            else
              echo "  → Re-requesting review from team $team_slug ($APPROVAL_COUNT of $REQUIRED_APPROVALS approvals received)"

              RE_REQUEST_RESPONSE=$(gh api \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                /repos/${{ github.repository }}/pulls/$PR_NUMBER/requested_reviewers \
                -f "team_reviewers[]=$team_slug" 2>&1)
              RE_REQUEST_STATUS=$?

              if [ $RE_REQUEST_STATUS -eq 0 ]; then
                echo "  ✓ Successfully re-requested review from $team_slug"
                TEAMS_RE_REQUESTED=$((TEAMS_RE_REQUESTED + 1))
              else
                echo "  ✗ Failed to re-request review from $team_slug"
                echo "  Error: $RE_REQUEST_RESPONSE"
              fi
            fi
          done

          echo ""
          echo "================================================"
          echo "Summary"
          echo "================================================"
          echo "Teams re-requested:       $TEAMS_RE_REQUESTED"
          echo "Teams threshold met:      $TEAMS_THRESHOLD_MET"
          echo "================================================"

      - name: Verify final PR reviewer state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ""
          echo "================================================"
          echo "Final PR Reviewer State"
          echo "================================================"

          FINAL_RESPONSE=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers)

          echo "Current Requested Reviewers:"
          echo "$FINAL_RESPONSE" | jq '.'

          echo ""
          echo "Requested Teams:"
          FINAL_TEAMS=$(echo "$FINAL_RESPONSE" | jq -r '.teams[].slug')
          if [ -z "$FINAL_TEAMS" ]; then
            echo "  (none)"
          else
            echo "$FINAL_TEAMS" | while read -r team; do echo "  - $team"; done
          fi

          echo ""
          echo "Requested Individual Reviewers:"
          FINAL_USERS=$(echo "$FINAL_RESPONSE" | jq -r '.users[].login')
          if [ -z "$FINAL_USERS" ]; then
            echo "  (none)"
          else
            echo "$FINAL_USERS" | while read -r user; do echo "  - $user"; done
          fi
          echo "================================================"
