name: PR review

on:
  pull_request_review:
    types: [submitted]

jobs:
  re_request_team_review:
    if: github.event.review.state == 'approved' || github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get teams from CODEOWNERS for changed files
        id: get_teams
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORG="${{ github.repository_owner }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          CODEOWNERS_FILE=""
          for f in CODEOWNERS .github/CODEOWNERS docs/CODEOWNERS; do
            [ -f "$f" ] && CODEOWNERS_FILE="$f" && break
          done

          if [ -z "$CODEOWNERS_FILE" ]; then
            echo "No CODEOWNERS file found — nothing to re-request."
            echo "teams=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Reading teams from: $CODEOWNERS_FILE"

          CHANGED_FILES=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')

          echo "Changed files:"
          echo "$CHANGED_FILES" | while read -r f; do echo "  $f"; done

          # For each changed file, find the last matching CODEOWNERS rule (GitHub spec:
          # last match wins). Collect the union of teams across all matched rules.
          MATCHED_TEAMS=""

          while IFS= read -r filepath; do
            [ -z "$filepath" ] && continue

            # Walk every non-comment rule; track the last one that matches.
            LAST_MATCH_OWNERS=""
            while IFS= read -r line; do
              # Skip comments and blank lines.
              [[ "$line" =~ ^[[:space:]]*# ]] && continue
              [[ -z "${line// }" ]] && continue

              PATTERN=$(echo "$line" | awk '{print $1}')
              OWNERS=$(echo "$line"  | awk '{$1=""; print $0}' | xargs)

              # Convert CODEOWNERS glob to shell glob:
              #   /foo  → anchored to repo root (foo)
              #   foo   → matches anywhere (**/foo)
              #   foo/  → directory prefix (foo/**)
              if [[ "$PATTERN" == /* ]]; then
                SHELL_PATTERN="${PATTERN#/}"          # strip leading /
              else
                SHELL_PATTERN="**/$PATTERN"
              fi

              # Use bash extglob-style match via 'case'.
              if [[ "$filepath" == $SHELL_PATTERN ]] || \
                 [[ "$filepath" == ${SHELL_PATTERN%/}/** ]]; then
                LAST_MATCH_OWNERS="$OWNERS"
              fi
            done < "$CODEOWNERS_FILE"

            if [ -n "$LAST_MATCH_OWNERS" ]; then
              echo "  $filepath → $LAST_MATCH_OWNERS"
              MATCHED_TEAMS="$MATCHED_TEAMS $LAST_MATCH_OWNERS"
            fi
          done <<< "$CHANGED_FILES"

          # Extract only @org/team entries, strip org prefix, deduplicate.
          TEAMS=$(echo "$MATCHED_TEAMS" \
            | grep -oE "@[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+" \
            | sed "s|@$ORG/||I" \
            | sort -u)

          echo "Teams to re-request: $(echo "$TEAMS" | tr '\n' ' ')"

          echo "teams<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TEAMS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Re-request team reviews
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          TEAMS="${{ steps.get_teams.outputs.teams }}"

          if [ -z "$TEAMS" ]; then
            echo "No CODEOWNERS teams found — nothing to re-request."
            exit 0
          fi

          MAX_ATTEMPTS=6
          RETRY_DELAY=5  # seconds

          while IFS= read -r team_slug; do
            echo "Re-requesting review from team: $team_slug"

            CONFIRMED=false
            for attempt in $(seq 1 $MAX_ATTEMPTS); do
              echo "  Attempt $attempt/$MAX_ATTEMPTS..."

              gh pr edit "$PR_NUMBER" --add-reviewer "${{ github.repository_owner }}/$team_slug" > /dev/null

              # Confirm the team is actually present — GitHub may remove it immediately
              # if review event processing hasn't settled yet.
              CURRENT_TEAMS=$(gh pr view "$PR_NUMBER" --json reviewRequests \
                --jq '[.reviewRequests[] | select(.type == "Team") | .slug] | join(",")')

              if [[ "$CURRENT_TEAMS" == *"$team_slug"* ]]; then
                echo "  ✓ Confirmed: $team_slug is in requested reviewers"
                CONFIRMED=true
                break
              fi

              echo "  Team not yet present (current: ${CURRENT_TEAMS:-none}), retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            done

            if [ "$CONFIRMED" = false ]; then
              echo "  ✗ Failed to confirm $team_slug after $MAX_ATTEMPTS attempts"
            fi
          done <<< "$TEAMS"
